{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>

    <title>{% block title %}OkItIsIDEA{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>
    <header class="site-header">
        <a class="logo" href="{% url 'HBase' %}">OkItIsIDEA</a>

    
    <nav>
