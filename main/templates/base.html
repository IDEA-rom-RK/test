
{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}OkItIsIDEA{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>

<body>

    <header class="site-header">

        <a class="logo" href="{% url 'HBase' %}">
            OkItIsIDEA
        </a>

        <nav>
            <a href="{% url 'HBase' %}">Главная</a>

            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="profile-button">
            {% else %}
                <a href="{% url 'log' %}" class="profile-button">
            {% endif %}

                <span class="person-icon">
                    <span class="person-head"></span>
                    <span class="person-body"></span>
                </span>

            </a>
        </nav>

    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>OkItIsIDEA © 2026</p>
    </footer>

</body>
</html>
