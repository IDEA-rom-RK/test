{% extends "base.html" %}
{% load static %}

{% block title %}Главная — OkItIsIDEA{% endblock %}

{% block content %}
    <h1>Добро пожаловать в OkItIsIDEA</h1>
    <div class="slider">
    <div class="slides">
        <div class="slide active">
            <img src="{% static 'CSS/images/Zombatar_1.jpg' %}" alt="Первое изображение">
        </div>

        <div class="slide">
            <img src="{% static 'CSS/images/Prewiu.jpg' %}" alt="Второе изображение">
        </div>

        <div class="slide">
            <img src="{% static 'CSS/images/3.jpg' %}" alt="Третье изображение">
        </div>
    </div>

        <button class="prev" type="button" aria-label="Предыдущий слайд">&#10094;</button>
        <button class="next" type="button" aria-label="Следующий слайд">&#10095;</button>
    </div>
    <script src="{% static 'CSS/slider.js' %}" defer></script>
{% endblock %}
